name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.25'
  BUN_VERSION: '1.3'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build frontend
        run: |
          cd web-svelte && bun install && bun run build
          rm -rf ../internal/web/static
          mkdir -p ../internal/web/static
          cp -r dist/* ../internal/web/static/
          touch ../internal/web/static/.gitkeep

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: internal/web/static
          retention-days: 1

  build-cli:
    name: Build CLI (${{ matrix.suffix }})
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-x64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-x64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-x64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: internal/web/static

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X github.com/sthbryan/ftm/internal/version.Version=${VERSION}" \
            -o ftm-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/ftm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftm-${{ matrix.suffix }}
          path: ftm-${{ matrix.suffix }}${{ matrix.ext }}
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.suffix }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: darwin
            platform: darwin/arm64
          - os: ubuntu-22.04
            suffix: linux
            platform: linux/amd64
          - os: windows-latest
            suffix: windows
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web-assets

      - name: Select newest Xcode (actool needs 26+ for the layered app icon)
        if: matrix.suffix == 'darwin'
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install Linux deps (WebKitGTK for Wails v3 gtk3)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config gcc \
            libayatana-appindicator3-dev imagemagick

      - name: Copy web assets into CLI embed path
        shell: bash
        run: |
          mkdir -p internal/web/static
          cp -r web-assets/* internal/web/static/
          touch internal/web/static/.gitkeep
          mkdir -p desktop/build/bin

      - name: Build Desktop (Wails v3 / go build)
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT=desktop/build/bin
          VERSION="${VERSION#v}"
          case "${{ matrix.suffix }}" in
            linux)
              CGO_ENABLED=1 go build -tags "production,gtk3" -ldflags "-s -w" \
                -o "$OUT/ftm-desktop-linux" ./desktop
              VERSION="$VERSION" ./scripts/package-appimage.sh "$OUT/ftm-desktop-linux" "$OUT"
              ;;
            windows)
              go run github.com/tc-hib/go-winres@v0.3.3 make \
                --in desktop/winres/winres.json --out desktop/rsrc --arch amd64 \
                --product-version "$VERSION" --file-version "$VERSION"
              CGO_ENABLED=1 go build -tags production -ldflags "-s -w -H windowsgui" \
                -o "$OUT/ftm-desktop-windows.exe" ./desktop
              ;;
            darwin)
              CGO_ENABLED=1 go build -tags production -ldflags "-s -w" \
                -o "$OUT/ftm-desktop" ./desktop
              VERSION="$VERSION" ./scripts/package-macos-app.sh "$OUT/ftm-desktop" "$OUT"
              ;;
          esac

      - name: Package MSIX
        if: matrix.suffix == 'windows'
        shell: pwsh
        env:
          SECRET_IDENTITY: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          SECRET_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $id = $env:SECRET_IDENTITY
          if ([string]::IsNullOrWhiteSpace($id)) { $id = "sthbryan.ftm" }
          $pub = $env:SECRET_PUBLISHER
          if ([string]::IsNullOrWhiteSpace($pub)) { $pub = "CN=ftm-ci" }
          Write-Host "MSIX IdentityName=$id Publisher=$pub Version=$ver"
          .\scripts\package-msix.ps1 `
            -ExePath .\desktop\build\bin\ftm-desktop-windows.exe `
            -Version $ver `
            -IdentityName $id `
            -Publisher $pub `
            -OutputDir .\desktop\build\msix `
            -OutputName ftm-desktop `
            -ExeName ftm-desktop.exe `
            -IconPath .\desktop\icon.png

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: ftm-desktop-${{ matrix.suffix }}
          path: desktop/build/bin
          retention-days: 7

      - name: Upload MSIX
        if: matrix.suffix == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-ftm-desktop
          path: desktop/build/msix/*.msix
          retention-days: 14

  release:
    name: Create Release
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ftm-*
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
