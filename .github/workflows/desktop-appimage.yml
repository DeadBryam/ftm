# Build the Linux desktop AppImage on demand (no GitHub Release).
# Run from Actions → "Desktop AppImage" → Run workflow.
# Download the appimage-ftm-desktop artifact when the job finishes.
name: Desktop AppImage

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  BUN_VERSION: 'latest'

concurrency:
  group: desktop-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Build Linux desktop AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config gcc \
            libayatana-appindicator3-dev librsvg2-common libgdk-pixbuf2.0-0 \
            gsettings-desktop-schemas adwaita-icon-theme imagemagick

      - name: Build web assets
        run: |
          cd web-svelte && bun install && bun run build
          rm -rf ../internal/web/static
          mkdir -p ../internal/web/static
          cp -r dist/* ../internal/web/static/
          touch ../internal/web/static/.gitkeep

      - name: Build desktop
        run: |
          mkdir -p desktop/build/bin
          CGO_ENABLED=1 go build -tags "production,gtk3" -ldflags "-s -w" \
            -o desktop/build/bin/ftm-desktop-linux ./desktop

      - name: Package AppImage
        run: ./scripts/package-appimage.sh desktop/build/bin/ftm-desktop-linux desktop/build/bin

      - name: Smoke test the AppImage
        run: |
          APPIMAGE=desktop/build/bin/ftm-desktop-linux-x86_64.AppImage
          test -x "$APPIMAGE"
          ls -lh "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract >/dev/null
          test -f squashfs-root/ftm-desktop.desktop
          test -f squashfs-root/ftm-desktop.png
          echo "bundled webkit/gtk libraries:"
          find squashfs-root -name 'libwebkit2gtk*' -o -name 'libgtk-3*' | head

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-ftm-desktop
          path: desktop/build/bin/*.AppImage
          retention-days: 14
