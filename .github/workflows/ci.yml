name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.22'
  BUN_VERSION: '1.3'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Build frontend
        run: |
          cd web-svelte && bun install && bun run build
          mkdir -p ../desktop/frontend/dist
          cp -r dist/* ../desktop/frontend/dist/
          cp -r dist/* ../internal/web/static/

      - name: Typecheck Svelte
        run: cd web-svelte && bun run check

      - name: Test Svelte
        run: cd web-svelte && bun run test

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet $(go list ./... | grep -v '/desktop')

      - name: Build
        run: go build -v $(go list ./... | grep -v '/desktop')

      # -race catches the data races that a tunnel manager is prone to: the TUI
      # renders the same state the process goroutines are writing.
      - name: Test
        run: go test -race -v $(go list ./... | grep -v '/desktop')

  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The web assets are embedded via go:embed, so the package will not build
      # without something at internal/web/static.
      - name: Stub embedded assets
        run: touch internal/web/static/index.html

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned: "latest" is now v2, whose config schema is incompatible
          # with the .golangci.yml in this repo.
          version: v1.64.8
          args: --timeout=5m ./cmd/... ./internal/...

  build-desktop:
    name: Build Desktop (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            suffix: darwin
            platform: darwin/arm64
          - os: ubuntu-latest
            suffix: linux
            platform: linux/amd64
          - os: windows-latest
            suffix: windows
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build Svelte
        run: cd web-svelte && bun install && bun run build

      - name: Copy assets
        run: |
          mkdir -p desktop/frontend/dist
          mkdir -p desktop/build
          cp -r web-svelte/dist/* desktop/frontend/dist/
          cp -r web-svelte/dist/* internal/web/static/
          cp desktop/icon.png desktop/build/appicon.png

      - name: Build Desktop
        run: cd desktop && wails build -s -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ftm-desktop-${{ matrix.suffix }}
          path: desktop/build/bin
