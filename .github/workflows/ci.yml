name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.25'
  BUN_VERSION: '1.3'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint & Test Go
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Stub embedded assets
        run: |
          mkdir -p internal/web/static
          touch internal/web/static/index.html

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet $(go list ./... | grep -v '/desktop')

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m ./cmd/... ./internal/...

      - name: Test
        run: go test -race -v $(go list ./... | grep -v '/desktop')

  lint-frontend:
    name: Lint & Test Frontend
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: cd web-svelte && bun install

      - name: Typecheck
        run: cd web-svelte && bun run check

      - name: Test
        run: cd web-svelte && bun run test
